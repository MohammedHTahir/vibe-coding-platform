# Phase 1 verification pass: each competitor's public docs and pricing
# page were checked on the date below. The runtime mirror at
# `lib/competitors.ts` carries the typed copy of this data and is what
# the /vs/[competitor] and /alternatives/[competitor] pages render.
# Keep both files in sync.

competitors:
  - id: "comp_lovable"
    name: "Lovable"
    website: "https://lovable.dev"
    category: "AI app generator with hosted runtime"
    pricing_model: "Free, Pro $25/mo, Business $50/mo. Credit-based with daily and monthly caps."
    strengths: |
      First-class Supabase integration, Dev Mode for direct code editing,
      bidirectional GitHub sync, and a strong template gallery.
    weaknesses: |
      Hosted runtime rather than a real Linux sandbox, single internal
      model with no per-turn choice, free tier capped at 5 daily / 30
      monthly credits.
    notes: "Verified against lovable.dev/pricing and docs.lovable.dev on 2026-05-23."

  - id: "comp_bolt"
    name: "Bolt.new"
    website: "https://bolt.new"
    category: "Browser-based AI dev environment (StackBlitz)"
    pricing_model: "Free trial, Pro from $20/mo, scales with token usage. Token-based, runs through Bolt's StackBlitz account."
    strengths: |
      WebContainer runtime in the browser tab means zero install and
      instant time-to-preview. Strong template ecosystem, GitHub export,
      and Netlify deploy.
    weaknesses: |
      WebContainer can't run native binaries, has tighter resource
      ceilings, and behaves differently from a real Linux box. Token
      consumption can be unpredictable.
    notes: "Verified against bolt.new/pricing, support.bolt.new, and the Bolt PostHog newsletter on 2026-05-23."

  - id: "comp_replit_agent"
    name: "Replit Agent"
    website: "https://replit.com"
    category: "AI coding agent inside Replit's cloud IDE"
    pricing_model: "Free, Core $20/mo, Pro $100/mo. Subscription plus usage-based Agent credits."
    strengths: |
      Real Linux Repl per project with full shell access, native
      one-click deploy, mobile app builds via Replit Mobile, and an
      established community.
    weaknesses: |
      Pricing has multiple layers (subscription + Agent credits + deploy
      compute), the IDE surface is broader than just an agent, and
      internal model orchestration is opaque.
    notes: "Verified against replit.com/pricing, replit.com/blog/pro-plan, and docs.replit.com on 2026-05-23."

  - id: "comp_base44"
    name: "Base44"
    website: "https://base44.com"
    category: "AI app builder with managed hosting"
    pricing_model: "Free, Starter from $16/mo (annual), up to Elite $160/mo. Credit-based; build prompts cost more than discussion."
    strengths: |
      Multi-model orchestration (Claude Sonnet, Gemini 2.5 Pro, GPT-5)
      under the hood, one-click deploy on every plan including free,
      and 20+ pre-built integrations.
    weaknesses: |
      GitHub export only on paid plans, hosted runtime rather than a
      real Linux sandbox, and a smaller third-party ecosystem than
      Replit or Lovable.
    notes: "Verified against base44.com/pricing and docs.base44.com on 2026-05-23."

  - id: "comp_v0"
    name: "v0 by Vercel"
    website: "https://v0.dev"
    category: "AI UI generator and app builder by Vercel"
    pricing_model: "Free ($5 monthly credits), Premium $20/mo, Team $30/user/mo, Business $100/user/mo. Credit-based; v0 Mini/Pro/Max consume different rates."
    strengths: |
      Tightest integration with Vercel hosting and preview URLs,
      automatic GitHub branching with auto-commits, and multiple
      in-house model tiers (Mini, Pro, Max, Max Fast).
    weaknesses: |
      Heavily Vercel-centric, no support for switching to Claude/GPT/Grok
      per turn, and free credits are very limited ($5/month).
    notes: "Verified against v0.dev/pricing, v0.dev/docs, and vercel.com/blog/improved-v0-pricing on 2026-05-23."

