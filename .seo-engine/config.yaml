cms:
  type: "next"
  framework_version: "16"
  blog_directory: "src/content/blog"
  blog_route: "app/blog"
  docs_directory: ""
  frontmatter_format: "yaml"
  date_format: "YYYY-MM-DD"
  slug_style: "kebab-case"
